<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイマー</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
    background: #fff;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border: 1px solid #000;
    border-radius: 8px;
    padding: 24px 20px 18px;
    text-align: center;
  }

  h1 {
    margin: 0 0 16px;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: .3em;
    color: #000;
    text-transform: uppercase;
  }

  .modes {
    display: flex;
    gap: 0;
    justify-content: center;
    margin-bottom: 16px;
  }

  .modes button {
    padding: 8px 16px;
    font-size: 13px;
    color: #000;
    background: #fff;
    border: 1px solid #000;
    cursor: pointer;
  }

  .modes button:first-child {
    border-radius: 999px 0 0 999px;
    border-right: none;
  }

  .modes button:last-child {
    border-radius: 0 999px 999px 0;
  }

  .modes button.active {
    background: #000;
    color: #fff;
  }

  .app.up .setup,
  .app.up .presets {
    display: none;
  }

  .clock {
    position: relative;
    width: 220px;
    height: 220px;
    margin: 0 auto 16px;
  }

  .clock svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .clock circle {
    fill: none;
    stroke-width: 6;
  }

  .track { stroke: #e5e5e5; }

  .progress {
    stroke: #000;
    stroke-linecap: butt;
    stroke-dasharray: 678.58;
    stroke-dashoffset: 0;
  }

  .display {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .time {
    font-size: 48px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    line-height: 1;
  }

  .status {
    font-size: 12px;
    color: #666;
    letter-spacing: .1em;
    min-height: 18px;
  }

  .setup {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 14px;
  }

  .setup label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #000;
  }

  .setup input {
    width: 72px;
    padding: 8px;
    font-size: 16px;
    text-align: center;
    color: #000;
    background: #fff;
    border: 1px solid #000;
    border-radius: 4px;
    outline: none;
    font-variant-numeric: tabular-nums;
  }

  .setup input:disabled { opacity: .4; }

  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .presets button {
    padding: 6px 12px;
    font-size: 13px;
    color: #000;
    background: #fff;
    border: 1px solid #000;
    border-radius: 999px;
    cursor: pointer;
  }

  .presets button:hover {
    background: #000;
    color: #fff;
  }

  .controls {
    display: flex;
    gap: 8px;
  }

  .controls button {
    flex: 1;
    padding: 12px;
    font-size: 15px;
    font-weight: 400;
    border-radius: 6px;
    border: 1px solid #000;
    background: #fff;
    color: #000;
    cursor: pointer;
  }

  .controls .primary {
    background: #000;
    color: #fff;
  }

  .controls button:hover { opacity: .75; }
  .controls button:active { opacity: .6; }

  .hint {
    margin: 14px 0 0;
    font-size: 12px;
    color: #666;
  }

  kbd {
    padding: 1px 6px;
    background: #fff;
    border: 1px solid #666;
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
  }
</style>
</head>
<body>
<main class="app" id="app">
  <h1>Timer</h1>

  <div class="modes" id="modes">
    <button data-mode="down" class="active">カウントダウン</button>
    <button data-mode="up">カウントアップ</button>
  </div>

  <div class="clock">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <circle class="track" cx="120" cy="120" r="108"/>
      <circle class="progress" id="ring" cx="120" cy="120" r="108"/>
    </svg>
    <div class="display">
      <div class="time" id="time" role="timer" aria-live="polite">05:00</div>
      <div class="status" id="status">準備OK</div>
    </div>
  </div>

  <div class="setup">
    <label><input type="number" id="minutes" min="0" max="99" value="5" aria-label="分"> 分</label>
    <label><input type="number" id="seconds" min="0" max="59" value="0" aria-label="秒"> 秒</label>
  </div>

  <div class="presets" id="presets">
    <button data-sec="60">1分</button>
    <button data-sec="180">3分</button>
    <button data-sec="300">5分</button>
    <button data-sec="600">10分</button>
    <button data-sec="900">15分</button>
    <button data-sec="1800">30分</button>
  </div>

  <div class="controls">
    <button class="primary" id="toggle">スタート</button>
    <button id="reset">リセット</button>
  </div>

  <p class="hint"><kbd>Space</kbd> 開始 / 一時停止 ・ <kbd>R</kbd> リセット</p>
</main>

<script>
(function () {
  "use strict";

  var CIRCUMFERENCE = 2 * Math.PI * 108; // r = 108
  var TITLE = "タイマー";

  var app = document.getElementById("app");
  var ring = document.getElementById("ring");
  var timeEl = document.getElementById("time");
  var statusEl = document.getElementById("status");
  var minutesInput = document.getElementById("minutes");
  var secondsInput = document.getElementById("seconds");
  var toggleBtn = document.getElementById("toggle");
  var resetBtn = document.getElementById("reset");
  var presets = document.getElementById("presets");
  var modes = document.getElementById("modes");

  var mode = "down"; // "down" | "up"
  var totalMs = 5 * 60 * 1000;
  var remainingMs = totalMs;
  var elapsedMs = 0;
  var running = false;
  var endAt = 0;
  var startAt = 0;
  var intervalId = null;

  ring.style.strokeDasharray = CIRCUMFERENCE;

  function clamp(value, min, max) {
    value = parseInt(value, 10);
    if (isNaN(value)) value = 0;
    return Math.min(Math.max(value, min), max);
  }

  function pad(n) {
    return (n < 10 ? "0" : "") + n;
  }

  function format(ms) {
    var total = Math.max(0, Math.ceil(ms / 1000));
    return pad(Math.floor(total / 60)) + ":" + pad(total % 60);
  }

  function formatUp(ms) {
    var total = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    if (h > 0) return h + ":" + pad(m) + ":" + pad(s);
    return pad(m) + ":" + pad(s);
  }

  function render() {
    var text;
    var ratio;
    if (mode === "up") {
      text = formatUp(elapsedMs);
      ratio = (elapsedMs % 60000) / 60000;
    } else {
      text = format(remainingMs);
      ratio = totalMs > 0 ? remainingMs / totalMs : 0;
    }
    timeEl.textContent = text;
    document.title = running ? text + " - " + TITLE : TITLE;
    ring.style.strokeDashoffset = (CIRCUMFERENCE * (1 - ratio)).toFixed(2);
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function setInputsFromTotal() {
    minutesInput.value = Math.floor(totalMs / 60000);
    secondsInput.value = Math.floor((totalMs % 60000) / 1000);
  }

  function readInputs() {
    var m = clamp(minutesInput.value, 0, 99);
    var s = clamp(secondsInput.value, 0, 59);
    totalMs = (m * 60 + s) * 1000;
    setInputsFromTotal();
  }

  function beep() {
    try {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      var ctx = new AudioCtx();
      var pattern = [0, 0.28, 0.56];
      pattern.forEach(function (offset) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime + offset);
        gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + offset + 0.2);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + offset);
        osc.stop(ctx.currentTime + offset + 0.22);
      });
      setTimeout(function () { ctx.close(); }, 1500);
    } catch (e) {
      /* 音が再生できない環境では無視 */
    }
  }

  function stopLoop() {
    if (intervalId) clearInterval(intervalId);
    intervalId = null;
  }

  function finish() {
    running = false;
    remainingMs = 0;
    stopLoop();
    toggleBtn.textContent = "スタート";
    app.classList.add("done");
    setStatus("時間です！");
    render();
    beep();
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification("タイマー", { body: "時間です！" }); } catch (e) {}
    }
  }

  function tick() {
    if (!running) return;
    if (mode === "up") {
      elapsedMs = performance.now() - startAt;
      render();
      return;
    }
    remainingMs = Math.max(0, endAt - performance.now());
    render();
    if (remainingMs <= 0) {
      finish();
      return;
    }
  }

  function start() {
    if (mode === "up") {
      running = true;
      startAt = performance.now() - elapsedMs;
      app.classList.remove("done");
      toggleBtn.textContent = "一時停止";
      setStatus("計測中…");
      render();
      stopLoop();
      intervalId = setInterval(tick, 200);
      tick();
      return;
    }
    if (totalMs <= 0) return;
    if (remainingMs <= 0) remainingMs = totalMs;
    running = true;
    endAt = performance.now() + remainingMs;
    app.classList.remove("done");
    toggleBtn.textContent = "一時停止";
    setStatus("計測中…");
    setInputsDisabled(true);
    render();
    stopLoop();
    intervalId = setInterval(tick, 200);
    tick();
  }

  function pause() {
    running = false;
    stopLoop();
    toggleBtn.textContent = "再開";
    setStatus("一時停止中");
    render();
  }

  function reset() {
    running = false;
    stopLoop();
    app.classList.remove("done");
    if (mode === "up") {
      elapsedMs = 0;
    } else {
      remainingMs = totalMs;
      setInputsFromTotal();
    }
    toggleBtn.textContent = "スタート";
    setStatus("準備OK");
    setInputsDisabled(false);
    render();
  }

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    running = false;
    stopLoop();
    app.classList.remove("done");
    app.classList.toggle("up", mode === "up");
    var buttons = modes.querySelectorAll("button[data-mode]");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle("active", buttons[i].getAttribute("data-mode") === mode);
    }
    elapsedMs = 0;
    remainingMs = totalMs;
    toggleBtn.textContent = "スタート";
    setStatus("準備OK");
    setInputsDisabled(false);
    render();
  }

  function setInputsDisabled(disabled) {
    minutesInput.disabled = disabled;
    secondsInput.disabled = disabled;
  }

  function toggle() {
    if (running) pause();
    else start();
  }

  toggleBtn.addEventListener("click", toggle);
  resetBtn.addEventListener("click", reset);

  [minutesInput, secondsInput].forEach(function (input) {
    input.addEventListener("change", function () {
      readInputs();
      reset();
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        readInputs();
        reset();
      }
    });
  });

  presets.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-sec]");
    if (!btn) return;
    totalMs = parseInt(btn.getAttribute("data-sec"), 10) * 1000;
    reset();
  });

  modes.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    setMode(btn.getAttribute("data-mode"));
  });

  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    if (e.code === "Space") {
      e.preventDefault();
      toggle();
    } else if (e.key === "r" || e.key === "R") {
      e.preventDefault();
      reset();
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && running) tick();
  });

  if ("Notification" in window && Notification.permission === "default") {
    try { Notification.requestPermission(); } catch (e) {}
  }

  setInputsFromTotal();
  render();
})();
</script>
</body>
</html>
